[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceloop"
version = "0.1.0"
description = "Local-first agentic RAG service with trace-to-eval regression loop"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TraceLoop Authors" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langchain>=0.1.14",
    "langchain-core>=0.1.37",
    "langchain-community>=0.0.31",
    "langchain-openai>=0.1.1",
    "qdrant-client>=1.8.0",
    "fastembed>=0.2.6",
    "ragas>=0.1.5",
    "mlflow>=2.11.0",
    "langfuse>=2.21.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=7.0.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
