version: "3.8"

networks:
  traceloop-net:
    driver: bridge

volumes:
  qdrant_storage:
  postgres_data:
  redis_data:
  mlflow_data:

services:
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: traceloop-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - traceloop-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: traceloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_password
      POSTGRES_DB: langfuse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - traceloop-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: traceloop-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - traceloop-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  langfuse-server:
    image: langfuse/langfuse:2
    container_name: traceloop-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_password@postgres:5432/langfuse
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: local-secret-key-salt-traceloop-demo-32char
      NEXTAUTH_URL: http://localhost:3000
      SALT: local-salt-salt-salt-salt-salt-demo
    networks:
      - traceloop-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: ..
      dockerfile: docker/mlflow.Dockerfile
    container_name: traceloop-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow_artifacts
    networks:
      - traceloop-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  traceloop-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: traceloop-app
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      langfuse-server:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      LANGFUSE_HOST: http://langfuse-server:3000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      APP_PORT: 8000
    networks:
      - traceloop-net
