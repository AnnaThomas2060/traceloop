name: TraceLoop CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-eval-gate:
    name: Test and Evaluation Regression Gate
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:v1.8.4
        ports:
          - 6333:6333

    steps:
      - name: Step 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Step 2 - Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Step 3 - Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 ruff pytest-cov

      - name: Step 4 - Run Ruff and Flake8 lint checks
        run: |
          ruff check .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Step 5 - Run pytest test suite with coverage reporting
        run: |
          pytest --cov=app --cov=evals --cov=ingestion --cov=tracing -v

      - name: Step 6 - Verify Qdrant test service container readiness
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:6333/readyz; then
              echo "Qdrant container is ready."
              break
            fi
            sleep 1
          done

      - name: Step 7 - Run ingestion script on sample data
        run: |
          python -m ingestion.run_ingest --raw-data data/raw/sample_documents.jsonl

      - name: Step 8 - Run evaluation harness against baseline
        id: run_eval
        continue-on-error: true
        run: |
          python -m evals.run_evals --dataset evals/golden_dataset.json --mock-judge

      - name: Step 9 - Regression gate verification
        id: regression_gate
        run: |
          if [ "${{ steps.run_eval.outcome }}" != "success" ]; then
            echo "CI Gate Failure: Regression detected against evals/baseline.json. Deployment blocked."
            exit 1
          fi
          echo "CI Gate Success: All evaluation metrics meet or exceed baseline tolerance."

      - name: Step 10 - Emit evaluation scorecard table to GitHub Actions step summary
        if: always()
        run: |
          EVAL_STATUS="Verified"
          GATE_MSG="Regression gate evaluation passed successfully."
          if [ "${{ steps.regression_gate.outcome }}" != "success" ]; then
            EVAL_STATUS="Regressed"
            GATE_MSG="Regression gate failed: delta exceeded tolerance threshold (0.05)."
          fi

          echo "## TraceLoop CI Evaluation Scorecard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Baseline | Regression Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Faithfulness | 0.8800 | 0.05 | $EVAL_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Context Precision | 0.8500 | 0.05 | $EVAL_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Context Recall | 0.8200 | 0.05 | $EVAL_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Answer Relevancy | 0.8400 | 0.05 | $EVAL_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$GATE_MSG" >> $GITHUB_STEP_SUMMARY
